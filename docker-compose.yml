version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: student-rulebook-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  app:
    build: .
    container_name: student-rulebook-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  qdrant_storage:
